# Netlify – build a smerovanie pre jednostránkovú aplikáciu (React Router)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Všetky cesty (/kalendar, /tlac, /protokol/…) obslúži index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
